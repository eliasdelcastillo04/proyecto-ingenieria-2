<!DOCTYPE html>

<html class="h-full bg-background dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dermacare Elite - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#faf9f8",
                        "on-primary-fixed-variant": "#3d4759",
                        "inverse-primary": "#bdc7dc",
                        "outline-variant": "#c5c6cd",
                        "on-tertiary-container": "#b29c7b",
                        "surface-container-highest": "#e3e2e1",
                        "surface-container-high": "#e9e8e7",
                        "slate-muted": "#898989",
                        "secondary-fixed": "#7dfabf",
                        "on-secondary-fixed": "#002113",
                        "on-tertiary-fixed-variant": "#554429",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#00734d",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#261903",
                        "primary-fixed": "#d9e3f9",
                        "outline": "#75777d",
                        "error-container": "#ffdad6",
                        "secondary-container": "#7dfabf",
                        "surface-bright": "#faf9f8",
                        "surface-tint": "#555f71",
                        "status-reserved": "#FEEBC8",
                        "tertiary-fixed": "#f8dfba",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#121c2c",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#5fdda4",
                        "surface-variant": "#e3e2e1",
                        "on-secondary-fixed-variant": "#005235",
                        "surface": "#faf9f8",
                        "surface-dim": "#dadad9",
                        "tertiary": "#2c1f07",
                        "secondary": "#006c48",
                        "on-background": "#1a1c1c",
                        "inverse-on-surface": "#f1f0f0",
                        "on-primary-container": "#96a0b5",
                        "tertiary-fixed-dim": "#dbc39f",
                        "status-confirmed": "#BEE3F8",
                        "tertiary-container": "#43341a",
                        "inverse-surface": "#2f3130",
                        "surface-container": "#eeeeed",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "status-available": "#C6F6D5",
                        "border-subtle": "#E2E8F0",
                        "on-surface": "#1a1c1c",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f4f3f2",
                        "primary-container": "#2d3748",
                        "primary-fixed-dim": "#bdc7dc",
                        "primary": "#182232",
                        "on-surface-variant": "#45474c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "gutter": "16px",
                        "container-max": "1280px",
                        "margin-mobile": "16px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-xs": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],

                }
            }
        }
    </script>
<style>
        .premium-shadow {
            box-shadow: 0px 20px 48px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body class="h-full bg-background text-on-surface font-body-md flex items-center justify-center p-4">
<!-- Login Container -->
<main class="w-full max-w-md bg-surface-container-lowest border border-border-subtle rounded-xl premium-shadow p-8 flex flex-col items-center">
<!-- Logo Area -->
<div class="mb-8 flex flex-col items-center">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-4 shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">health_and_safety</span>
</div>
<h1 class="text-headline-md font-headline-md text-primary tracking-tight">Dermacare Elite</h1>
<p class="text-body-md font-body-md text-on-surface-variant mt-2 text-center">Clinical Portal Access</p>
</div>
<!-- Login Form -->
<form action="#" class="w-full flex flex-col gap-6" method="POST">
<div class="flex flex-col gap-1.5">
<label class="text-label-sm font-label-sm text-on-surface" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg">mail</span>
</div>
<input class="w-full pl-10 pr-3 py-2.5 bg-surface-bright border border-border-subtle rounded-lg text-body-md font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-secondary focus:border-secondary transition-colors" id="email" name="email" placeholder="clinician@dermacare.elite" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="text-label-sm font-label-sm text-on-surface" for="password">Password</label>
<a class="text-label-sm font-label-sm text-primary hover:text-secondary transition-colors duration-200" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-2.5 bg-surface-bright border border-border-subtle rounded-lg text-body-md font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-secondary focus:border-secondary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-lg">visibility_off</span>
</button>
</div>
</div>
<!-- Action Area -->
<div class="mt-2 flex flex-col gap-4">
<button class="w-full bg-secondary text-on-secondary py-3 px-4 rounded-lg text-body-md font-headline-md font-semibold hover:bg-on-secondary-fixed transition-colors duration-200 shadow-sm flex justify-center items-center gap-2 group" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-border-subtle"></div>
<span class="flex-shrink-0 mx-4 text-label-sm font-label-sm text-on-surface-variant">Secure Environment</span>
<div class="flex-grow border-t border-border-subtle"></div>
</div>
</div>
</form>
<p class="mt-8 text-label-xs font-label-xs text-on-surface-variant text-center max-w-xs">
            By logging in, you agree to Dermacare Elite's <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
        </p>
</main>
</body></html>
